# Hydra config. Override any value at runtime, for example:
# python scripts/generate_candidates.py embedding_batch_size=16 top_k=100
source1_path: data/source1.tsv
source2_path: data/source2.tsv
source3_path: data/source3.tsv
ground_truth_path: data/ground_truth.tsv
index_dir: indexes
candidates_path: outputs/candidates.tsv
evaluation_path: outputs/evaluation.json
chunk_size: 4096
embedding_batch_size: 64
top_k: 50
model_name: BAAI/bge-m3
embedding_dim: 1024
gpu_ids: [0, 1]
nlist: 4096
pq_m: 64
pq_nbits: 8
nprobe: 32
exact_threshold: 50000
fallback_mode: all_countries
temp_dir: tmp
workers: 1
log_level: INFO
backend: hash

hydra:
  job:
    chdir: false
  output_subdir: null
