[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-resolution-candidates"
version = "0.1.0"
description = "Streaming multilingual entity-resolution candidate generation with FAISS"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
